  revision: null
  tokenizer_revision: null
  precision: bf16
  max_prompt_tokens: 512
  device: cuda
adapter:
  rank: 16
  alpha: 32
  dropout: 0.0
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
task:
